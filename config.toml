# The URL the site will be built for
base_url = "https://blog.nathanhigley.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

generate_feeds = true

theme = "terminimal"

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

[extra]
logo_text = "~/blog"
accent_color = "red"
background_color = "dark"
show_only_description = true
author = "Nathan Higley"


menu_items = [
    {name = "posts", url = "$BASE_URL/"},
    {name = "about", url = "https://nathanhigley.com"},
    {name = "github", url = "https://github.com/astr0n8t", newtab = true},
]

enable_post_view_navigation = false
post_view_navigation_prompt = ""
page_titles = "page_only"
favicon = "/favicon-16x16.png"
favicon_mimetype = "image/png"
